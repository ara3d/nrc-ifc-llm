<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#f7f8fa"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1c2430">Door Clearance Compliance Demo</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#5b6470">building code &#8594; machine-readable rule &#8594; automated checker &#183; duplex.ifc &#183; 2026-08-04</text>

  <!-- ===== Pipeline stage cards ===== -->
  <!-- CODE -->
  <g>
    <rect x="50" y="100" width="330" height="150" rx="10" fill="#ffffff" stroke="#d4d9e0"/>
    <rect x="50" y="100" width="330" height="34" rx="10" fill="#1c2430"/>
    <rect x="50" y="124" width="330" height="10" fill="#1c2430"/>
    <text x="215" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1 &#183; CODE</text>
    <text x="70" y="160" font-size="13" fill="#3a4350" font-style="italic">&#8220;Doorways shall provide a clear</text>
    <text x="70" y="180" font-size="13" fill="#3a4350" font-style="italic">width of not less than 850 mm&#8230;&#8221;</text>
    <text x="70" y="208" font-size="12" fill="#5b6470">NBC 2020 &#167;3.8.3.12 (illustrative)</text>
    <text x="70" y="230" font-size="12" fill="#5b6470">+ maneuvering-space provision</text>
  </g>

  <line x1="380" y1="175" x2="428" y2="175" stroke="#5b6470" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- RULE -->
  <g>
    <rect x="435" y="100" width="330" height="150" rx="10" fill="#ffffff" stroke="#d4d9e0"/>
    <rect x="435" y="100" width="330" height="34" rx="10" fill="#1565c0"/>
    <rect x="435" y="124" width="330" height="10" fill="#1565c0"/>
    <text x="600" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2 &#183; RULE (JSON)</text>
    <text x="455" y="158" font-size="12.5" font-family="Consolas, monospace" fill="#3a4350">{ "id": "DC-W1",</text>
    <text x="455" y="177" font-size="12.5" font-family="Consolas, monospace" fill="#3a4350">&#160;&#160;"applies": "IFCDOOR",</text>
    <text x="455" y="196" font-size="12.5" font-family="Consolas, monospace" fill="#3a4350">&#160;&#160;"kind": "property-threshold",</text>
    <text x="455" y="215" font-size="12.5" font-family="Consolas, monospace" fill="#3a4350">&#160;&#160;"minWidthMm": 850 }</text>
    <text x="455" y="238" font-size="12" fill="#5b6470">4 rules: 2 property &#183; 2 geometric</text>
  </g>

  <line x1="765" y1="175" x2="813" y2="175" stroke="#5b6470" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- CHECKER -->
  <g>
    <rect x="820" y="100" width="330" height="150" rx="10" fill="#ffffff" stroke="#d4d9e0"/>
    <rect x="820" y="100" width="330" height="34" rx="10" fill="#2e7d32"/>
    <rect x="820" y="124" width="330" height="10" fill="#2e7d32"/>
    <text x="985" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3 &#183; CHECKER</text>
    <text x="840" y="158" font-size="12.5" font-family="Consolas, monospace" fill="#3a4350">globalId, rule, verdict, evidence</text>
    <text x="840" y="177" font-size="12.5" font-family="Consolas, monospace" fill="#2e7d32">1hOS&#8230;RGQ, DC-W1, pass, 1250mm</text>
    <text x="840" y="196" font-size="12.5" font-family="Consolas, monospace" fill="#c62828">1hOS&#8230;S8Z, DC-W1, fail, 762mm</text>
    <text x="840" y="215" font-size="12.5" font-family="Consolas, monospace" fill="#c62828">2OBr&#8230;Uu2, DC-Z1, fail, obstructed</text>
    <text x="840" y="238" font-size="12" fill="#5b6470">verdicts.csv &#183; run-log &#183; SHA-256</text>
  </g>

  <!-- ===== Plan view (left) ===== -->
  <g>
    <text x="80" y="308" font-size="16" font-weight="700" fill="#1c2430">Plan view &#183; rule DC-Z1 (zone unobstructed)</text>

    <!-- walls -->
    <rect x="80" y="330" width="180" height="16" fill="#3a4350"/>
    <rect x="352" y="330" width="180" height="16" fill="#3a4350"/>
    <!-- door opening gap 260..352 (92px ~ 920mm scale) -->

    <!-- clearance zone -->
    <rect x="260" y="346" width="92" height="150" fill="#1565c0" opacity="0.18" stroke="#1565c0" stroke-dasharray="6 4" stroke-width="1.5"/>
    <text x="306" y="470" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="600">clearance zone</text>
    <text x="306" y="486" text-anchor="middle" font-size="11" fill="#1565c0">depth = door width</text>

    <!-- door leaf + swing arc -->
    <line x1="260" y1="346" x2="260" y2="438" stroke="#8a5a00" stroke-width="5"/>
    <path d="M 260 438 A 92 92 0 0 0 352 346" fill="none" stroke="#8a5a00" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- obstruction -->
    <rect x="318" y="400" width="70" height="52" fill="#c62828" opacity="0.85" rx="3"/>
    <text x="353" y="431" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">furnishing</text>
    <!-- clash flash -->
    <circle cx="330" cy="412" r="9" fill="none" stroke="#c62828" stroke-width="2.5"/>
    <line x1="323" y1="405" x2="337" y2="419" stroke="#c62828" stroke-width="2.5"/>

    <!-- width annotation -->
    <line x1="260" y1="322" x2="352" y2="322" stroke="#5b6470" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="306" y="312" text-anchor="middle" font-size="12" fill="#5b6470">OverallWidth</text>

    <!-- verdict badge -->
    <rect x="80" y="520" width="452" height="34" rx="8" fill="#fdecea" stroke="#c62828"/>
    <text x="306" y="542" text-anchor="middle" font-size="13.5" fill="#c62828" font-weight="700">FAIL &#183; obstruction inside maneuvering zone &#183; 2 doors found (not staged)</text>
  </g>

  <!-- ===== Results (right) ===== -->
  <g>
    <text x="640" y="308" font-size="16" font-weight="700" fill="#1c2430">56 verdicts &#183; 14 doors &#215; 4 rules</text>

    <!-- bars: max 26 -> 380px width scale x*13 -->
    <text x="640" y="345" font-size="13" fill="#3a4350">pass</text>
    <rect x="740" y="331" width="338" height="20" rx="4" fill="#2e7d32"/>
    <text x="1086" y="346" font-size="13" font-weight="700" fill="#2e7d32">26</text>

    <text x="640" y="380" font-size="13" fill="#3a4350">fail</text>
    <rect x="740" y="366" width="104" height="20" rx="4" fill="#c62828"/>
    <text x="852" y="381" font-size="13" font-weight="700" fill="#c62828">8</text>

    <text x="640" y="415" font-size="13" fill="#3a4350">not applicable</text>
    <rect x="740" y="401" width="104" height="20" rx="4" fill="#9aa2ad"/>
    <text x="852" y="416" font-size="13" font-weight="700" fill="#6b7480">8</text>

    <text x="640" y="450" font-size="13" fill="#3a4350">inconclusive</text>
    <rect x="740" y="436" width="182" height="20" rx="4" fill="#f9a825"/>
    <text x="930" y="451" font-size="13" font-weight="700" fill="#b07800">14</text>

    <text x="640" y="486" font-size="12" fill="#5b6470">All four categories, each for an honest reason &#183; width verdicts match</text>
    <text x="640" y="503" font-size="12" fill="#5b6470">independent ground truth exactly (8 pass / 6 fail at 850 mm)</text>

    <!-- proof strip -->
    <rect x="640" y="520" width="510" height="76" rx="8" fill="#ffffff" stroke="#d4d9e0"/>
    <text x="660" y="545" font-size="13" fill="#1c2430" font-weight="700">Proof</text>
    <text x="660" y="565" font-size="12" fill="#3a4350">&#10003; 7/7 tests &#183; repeat runs byte-identical &#183; override recorded &amp; reversible</text>
    <text x="660" y="585" font-size="11.5" font-family="Consolas, monospace" fill="#5b6470">SHA-256 a06a44e41c5d08b7&#8230;4e2f0070e5 (independent runs agree)</text>
  </g>

  <!-- footer -->
  <text x="600" y="650" text-anchor="middle" font-size="12" fill="#8a92a0">ara3d-sdk e5dbb6e &#183; nrc-ifc-llm 3a3e844 / dce7a91 &#183; duplex.ifc: 38,898 entities &#183; 14 doors &#183; 61 obstacles</text>
</svg>
